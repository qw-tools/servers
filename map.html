<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Server Map - QuakeWorld Tools</title>
    <!-- the map is now a view on the servers page, keep old links working -->
    <script>
        const params = new URLSearchParams(location.search);
        params.set("view", "map");
        location.replace(`./?${params}`);
    </script>
</head>
<body>
    <a href="./?view=map">Server map</a>
</body>
</html>

name: Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    timeout-minutes: 5
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm, Node.js and install dependencies
        uses: pnpm/setup@v3
        with:
          runtime: node@lts
          cache: true
          require-lockfile: true

      - name: Lint and check formatting
        run: pnpm check

      - name: Build site
        run: |
          if [ -z "$VITE_MAPBOX_ACCESS_TOKEN" ]; then
            echo "::warning::secret VITE_MAPBOX_ACCESS_TOKEN is not set, the world map will not work"
          fi
          pnpm build
        env:
          VITE_MAPBOX_ACCESS_TOKEN: ${{ secrets.VITE_MAPBOX_ACCESS_TOKEN }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: 'dist'

  deploy:
    needs: build
    timeout-minutes: 5
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
